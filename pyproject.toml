[project]
name = "release-watch"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "prometheus-client>=0.21",
    "httpx>=0.28",
    "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.8", "botocore[crt]>=1.35"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: starts real Prometheus, Alertmanager and Grafana"]

[tool.ruff]
line-length = 100
